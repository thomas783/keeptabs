<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KeepTabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="list.css" />
</head>
<body>
  <header>
    <div class="wrap head">
      <div class="brand">
        <svg class="brand-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        <span class="brand-name">KeepTabs</span>
        <span class="tag" data-i18n="tagline"></span>
      </div>
      <div class="actions">
        <button id="save-now" class="btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
          <span data-i18n="save_window"></span>
        </button>
        <button id="settings" class="btn ghost icon" data-i18n-title="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
          </button>
        <button id="history" class="btn ghost icon" data-i18n-title="backup_history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
          </button>
        <button id="export" class="btn ghost icon" data-i18n-title="export">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          </button>
        <label class="btn ghost icon" for="import-file" data-i18n-title="import">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
          </label>
        <input type="file" id="import-file" accept="application/json" hidden />
        <select id="lang" class="lang" title="Language"></select>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="stats" class="stats"></div>
    <div id="sessions"></div>
    <div id="empty" class="empty" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <p data-i18n="empty"></p>
    </div>
  </main>

  <div id="history-modal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <strong data-i18n="history_title"></strong>
        <button id="history-close" class="x" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <p class="hint" data-i18n="history_hint"></p>
      <div id="history-list"></div>
    </div>
  </div>

  <div id="backup-modal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <strong data-i18n="backup_title"></strong>
        <button id="backup-close" class="x" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <p class="hint" data-i18n="backup_hint"></p>

      <div class="mode-row">
        <label><input type="radio" name="bmode" value="off" /> <span data-i18n="backup_off"></span></label>
        <label><input type="radio" name="bmode" value="folder" /> <span data-i18n="backup_folder"></span></label>
      </div>

      <div id="folder-panel" class="panel" hidden>
        <div class="conn-row">
          <span id="conn-badge" class="conn-badge">
            <span class="conn-dot"></span>
            <span id="conn-label"></span>
          </span>
          <button id="folder-toggle" class="mini">
            <span class="spinner" aria-hidden="true"></span>
            <span class="tgl-label"></span>
          </button>
        </div>
        <p id="folder-status" class="status detail"></p>
        <p class="hint" data-i18n="pick_folder_hint"></p>
        <p class="hint" data-i18n="path_privacy"></p>
      </div>

      <label class="auto"><input type="checkbox" id="auto-backup" /> <span data-i18n="auto_backup"></span></label>
      <div class="row end">
        <span id="backup-msg" class="status"></span>
        <button id="backup-now" class="btn"><span class="spinner" aria-hidden="true"></span><span data-i18n="backup_now"></span></button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="list.js"></script>
</body>
</html>
