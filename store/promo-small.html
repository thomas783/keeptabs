<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:440px;height:280px;overflow:hidden}
  body{font-family:"Inter",system-ui,sans-serif;
    background:linear-gradient(150deg,#14b8a6 0%,#0f766e 100%);color:#fff;
    display:flex;flex-direction:column;justify-content:center;padding:30px 32px;position:relative}
  body::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;
    border-radius:50%;background:rgba(255,255,255,.08)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);
    display:grid;place-items:center;backdrop-filter:blur(4px)}
  .logo svg{width:23px;height:23px}
  .brand b{font-size:22px;font-weight:800;letter-spacing:-.02em}
  h1{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
  .sub{margin-top:12px;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.9);line-height:1.5}
  .sub b{font-weight:700}
</style>
</head>
<body>
  <div class="brand">
    <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/><path d="m8.5 14.5 2.5 2.5 4.5-4.5"/></svg></span>
    <b>KeepTabs</b>
  </div>
  <h1>Never lose<br/>a tab.</h1>
  <div class="sub">One click saves your whole window · <b>auto version backups</b> · one-click restore · local-first, no account</div>
</body>
</html>
